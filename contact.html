<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>contact</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      /* custom smooth transitions */
      .card-hover {
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .card-hover:hover {
        transform: translateY(-6px) scale(1.01);
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      }
      .hero-gradient {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      }
      .pulse-dot {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }
    </style>
</head>

<body>
    <header class="glass-nav fixed top-0 left-0 w-full z-50 transition-all duration-300">
    <nav class="mx-auto flex max-w-7xl items-center justify-between p-4 lg:px-8">
      <div class="flex items-center gap-2">
        <a href="#" class="flex items-center gap-2">
          <i class="fas fa-calendar-check text-indigo-600 text-2xl"></i>
          <span class="text-xl font-bold tracking-tight text-slate-800">Nexus<span class="text-indigo-600">.</span></span>
        </a>
      </div>
      <div class="hidden lg:flex lg:items-center lg:gap-x-8">
        <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition">Home</a>
        <a href="event.html" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition">Events</a>
        <a href="contact.html" class="text-sm font-semibold text-indigo-600 border-b-2 border-indigo-500 pb-1">Contact</a>
      </div>
      <div class="hidden lg:flex items-center gap-4">
        <a href="#" class="text-sm font-medium text-slate-700 hover:text-indigo-600 transition">Log in</a>
        <a href="#" class="rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md shadow-indigo-200 hover:bg-indigo-500 transition">Get Started</a>
      </div>
      <!-- mobile toggle -->
      <button type="button" command="show-modal" commandfor="mobile-menu" class="lg:hidden -m-2.5 p-2.5 text-slate-700">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </nav>
    <!-- mobile menu -->
    <dialog id="mobile-menu" class="backdrop:bg-black/30 lg:hidden">
      <div class="fixed inset-0 focus:outline-none">
        <div class="fixed inset-y-0 right-0 z-50 w-full max-w-sm overflow-y-auto bg-white/95 backdrop-blur-xl p-6 shadow-2xl">
          <div class="flex items-center justify-between">
            <a href="#" class="flex items-center gap-2"><i class="fas fa-calendar-check text-indigo-600 text-xl"></i><span class="font-bold text-slate-800">Nexus</span></a>
            <button type="button" command="close" commandfor="mobile-menu" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 transition">
              <i class="fas fa-times text-xl"></i>
            </button>
          </div>
          <div class="mt-8 flow-root">
            <div class="-my-6 divide-y divide-slate-200">
              <div class="space-y-3 py-6">
                <a href="index.html" class="-mx-3 block rounded-lg px-3 py-2.5 text-base font-semibold text-slate-700 hover:bg-indigo-50 transition">Home</a>
                <a href="event.html" class="-mx-3 block rounded-lg px-3 py-2.5 text-base font-semibold text-slate-700 hover:bg-indigo-50 transition">Events</a>
                <a href="contact.html" class="-mx-3 block rounded-lg px-3 py-2.5 text-base font-semibold text-indigo-600 bg-indigo-50/70">Contact</a>
              </div>
              <div class="py-6 space-y-3">
                <a href="#" class="-mx-3 block rounded-lg px-3 py-2.5 text-base font-semibold text-slate-700 hover:bg-indigo-50 transition">Log in</a>
                <a href="#" class="-mx-3 block rounded-lg bg-indigo-600 px-3 py-2.5 text-center text-base font-semibold text-white">Get Started</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </dialog>
  </header>
    <div class="isolate bg-gray-900 px-6 py-24 sm:py-32 lg:px-8">
        <div aria-hidden="true"
            class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80">
            <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)"
                class="relative left-1/2 -z-10 aspect-1155/678 w-144.5 max-w-none -translate-x-1/2 rotate-30 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-20 sm:left-[calc(50%-40rem)] sm:w-288.75">
            </div>
        </div>
        <div class="mx-auto max-w-2xl text-center">
            <h2 class="text-4xl font-semibold tracking-tight text-balance text-white sm:text-5xl">Contact sales</h2>
            <p class="mt-2 text-lg/8 text-gray-400">Aute magna irure deserunt veniam aliqua magna enim voluptate.</p>
        </div>
        <form action="#" method="POST" class="mx-auto mt-16 max-w-xl sm:mt-20">
            <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2">
                <div>
                    <label for="first-name" class="block text-sm/6 font-semibold text-white">First name</label>
                    <div class="mt-2.5">
                        <input id="first-name" type="text" name="first-name" autocomplete="given-name"
                            class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
                    </div>
                </div>
                <div>
                    <label for="last-name" class="block text-sm/6 font-semibold text-white">Last name</label>
                    <div class="mt-2.5">
                        <input id="last-name" type="text" name="last-name" autocomplete="family-name"
                            class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
                    </div>
                </div>
                <div class="sm:col-span-2">
                    <label for="company" class="block text-sm/6 font-semibold text-white">Company</label>
                    <div class="mt-2.5">
                        <input id="company" type="text" name="company" autocomplete="organization"
                            class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
                    </div>
                </div>
                <div class="sm:col-span-2">
                    <label for="email" class="block text-sm/6 font-semibold text-white">Email</label>
                    <div class="mt-2.5">
                        <input id="email" type="email" name="email" autocomplete="email"
                            class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
                    </div>
                </div>
                <div class="sm:col-span-2">
                    <label for="phone-number" class="block text-sm/6 font-semibold text-white">Phone number</label>
                    <div class="mt-2.5">
                        <div
                            class="flex rounded-md bg-white/5 outline-1 -outline-offset-1 outline-white/10 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-500">
                            <div class="grid shrink-0 grid-cols-1 focus-within:relative">
                                <select id="country" name="country" autocomplete="country" aria-label="Country"
                                    class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-transparent py-2 pr-7 pl-3.5 text-base text-gray-400 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6">
                                    <option>US</option>
                                    <option>CA</option>
                                    <option>EU</option>
                                </select>
                                <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true"
                                    class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-400 sm:size-4">
                                    <path
                                        d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"
                                        clip-rule="evenodd" fill-rule="evenodd" />
                                </svg>
                            </div>
                            <input id="phone-number" type="text" name="phone-number" placeholder="123-456-7890"
                                class="block min-w-0 grow bg-transparent py-1.5 pr-3 pl-1 text-base text-white placeholder:text-gray-500 focus:outline-none sm:text-sm/6" />
                        </div>
                    </div>
                </div>
                <div class="sm:col-span-2">
                    <label for="message" class="block text-sm/6 font-semibold text-white">Message</label>
                    <div class="mt-2.5">
                        <textarea id="message" name="message" rows="4"
                            class="block w-full rounded-md bg-white/5 px-3.5 py-2 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500"></textarea>
                    </div>
                </div>
                <div class="flex gap-x-4 sm:col-span-2">
                    <div class="flex h-6 items-center">
                        <div
                            class="group relative inline-flex w-8 shrink-0 rounded-full bg-white/5 p-px inset-ring inset-ring-white/10 outline-offset-2 outline-indigo-500 transition-colors duration-200 ease-in-out has-checked:bg-indigo-500 has-focus-visible:outline-2">
                            <span
                                class="size-4 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-3.5"></span>
                            <input id="agree-to-policies" type="checkbox" name="agree-to-policies"
                                aria-label="Agree to policies"
                                class="absolute inset-0 size-full appearance-none focus:outline-hidden" />
                        </div>
                    </div>
                    <label for="agree-to-policies" class="text-sm/6 text-gray-400">
                        By selecting this, you agree to our
                        <a href="#" class="font-semibold whitespace-nowrap text-indigo-400">privacy policy</a>.
                    </label>
                </div>
            </div>
            <div class="mt-10">
                <button type="submit"
                    class="block w-full rounded-md bg-indigo-500 px-3.5 py-2.5 text-center text-sm font-semibold text-white shadow-xs hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">Let's
                    talk</button>
            </div>
        </form>
    </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-100 py-12">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
      <div class="flex flex-col items-center justify-between gap-6 sm:flex-row">
        <div class="flex items-center gap-x-3">
          <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt=""
            class="h-7 w-auto" />
          <span class="text-sm font-semibold text-gray-700">Nexus</span>
        </div>
        <div class="flex gap-x-8">
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors">Privacy</a>
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors">Terms</a>
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors">Support</a>
        </div>
        <p class="text-sm text-gray-400">&copy; 2026 Nexus. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('click', function(e) {
      const trigger = e.target.closest('[command]');
      if (!trigger) return;
      const cmd = trigger.getAttribute('command');
      const targetId = trigger.getAttribute('commandfor');
      const target = document.getElementById(targetId);
      if (!target) return;
      if (cmd === 'show-modal' || cmd === '--toggle') {
        if (target.tagName === 'DIALOG') {
          target.showModal();
        } else {
          target.hidden = !target.hidden;
        }
      }
      if (cmd === 'close') {
        if (target.tagName === 'DIALOG') {
          target.close();
        } else {
          target.hidden = true;
        }
      }
    });
    document.querySelectorAll('dialog').forEach(dialog => {
      dialog.addEventListener('click', function(e) {
        if (e.target === this) this.close();
      });
    });
  </script>

</body>

</html>
